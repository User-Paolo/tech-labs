name: lab 14 terraform

on:
  push:
    paths:
      - "cloud/14-iam-kms/**"
      - ".github/workflows/lab14-terraform.yml"
  pull_request:
    paths:
      - "cloud/14-iam-kms/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/14-iam-kms
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: checkov
        run: |
          pip install -q checkov==3.3.30
          checkov -d . --framework terraform --compact
