name: lab 16 checks

on:
  push:
    paths:
      - "cloud/16-kubernetes-eks/**"
      - ".github/workflows/lab16-checks.yml"
  pull_request:
    paths:
      - "cloud/16-kubernetes-eks/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/16-kubernetes-eks
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: terraform fmt
        working-directory: cloud/16-kubernetes-eks/terraform
        run: terraform fmt -check -diff

      - name: terraform validate
        working-directory: cloud/16-kubernetes-eks/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: app compiles
        run: python -m py_compile app/app.py

      - name: checkov
        run: |
          pip install -q checkov==3.3.30
          checkov -d . --framework kubernetes dockerfile terraform --compact
