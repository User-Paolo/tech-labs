# The AWS Load Balancer Controller turns this into an ALB that sends traffic straight to the pods
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lab16
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /ready
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
